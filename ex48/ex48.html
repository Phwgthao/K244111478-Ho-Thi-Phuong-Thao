<html>
    <head>
        <meta charset='utf-8'>
        <title>Phuong Thao</title>
    <style>
        body {
            background-color: #b3d9ff;
            font-family: 'Times New Roman', Times, serif;
        }
        .container {
            width: 600px;
            margin: 20px auto;
            padding: 20px;
            background-color: #cce6ff;
            border: 1px solid #333;
        }
        h2 {
            text-align: center;
        }
        label {
            display: inline-block;
            width: 100px;
        }
        input[type="text"], select, textarea {
            padding: 3px;
            margin: 3px 0;
        }
        .row {
            margin: 8px 0;
        }
        .buttons {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="text-align:center;">
            <img src="images/Jackson.gif" alt="Jackson Electronics Logo" height="60">
            <h2>Registration Form</h2>
            <p>Register your Jackson Electronics product here</p>
        </div>

        <form>
            <div class="row">
                <label for="First_name">First Name:</label>
                <input type="text" id="First_name" name="firstname">
                <label for="Last_name" style="width:80px;">Last Name:</label>
                <input type="text" id="Last_name" name="lastname">
            </div>
            <div class="row">
                <label for="Address1">Address #1:</label>
                <input type="text" id="Address1" name="address1" size="40">
            </div>
            <div class="row">
                <label for="Address2">Address #2:</label>
                <input type="text" id="Address2" name="address2" size="40">
            </div>
            <div class="row">
                <label for="City">City:</label>
                <input type="text" id="City" name="city">
                <label for="State" style="width:50px;">State:</label>
                <input type="text" id="State" name="state" size="5">
                <label for="Zip" style="width:30px;">Zip:</label>
                <input type="text" id="Zip" name="zip" size="6">
            </div>
            <div class="row">
                <label for="Country">Country:</label>
                <input type="text" id="Country" name="country" value="United States">
            </div>
            <hr>
            <div class="row">
                <label for="Product">Product:</label>
                <select id="Product" name="product">
                    <option>ScanMaster</option>
                    <option>PrinterPro</option>
                    <option>SmartCam</option>
                    <option>Other</option>
                </select>
            </div>
            <div class="row">
                <label for="Date_purchased">Date Purchased:</label>
                <input type="date" id="Date_purchased" name="date">
            </div>
            <div class="row">
                <label for="Serial">Serial #:</label>
                <input type="text" id="Serial" name="serial">
            </div>
            <div class="row">
                <label for="Used_for">Used for:</label><br>
                <input type="radio" id="Home" name="used" value="home">
                <label for="Home"> Home</label>
                <input type="radio" id="Business" name="used" value="business">
                <label for="Business"> Business</label>
                <input type="radio" id="Government" name="used" value="government">
                <label for="Government"> Government
                <input type="radio" name="used" value="edu"> Educational Institution
                <input type="radio" name="used" value="other"> Other
            </div>
            <div class="row">
                <label>System:</label><br>
                <input type="checkbox" name="system" value="windows"> Windows
                <input type="checkbox" name="system" value="mac"> Macintosh
                <input type="checkbox" name="system" value="unix"> UNIX
                <input type="checkbox" name="system" value="other"> Other
            </div>
            <hr>
            <div class="row">
                <label>Comments?:</label><br>
                <textarea name="comments" rows="5" cols="60"></textarea>
            </div>
            <div class="buttons">
                <input type="submit" value="Click to register">
                <input type="reset" value="Click to cancel">
            </div>
        </form>
    </div>
</body>
</html>
